  theme_scripture_text: |
    이 강물이 흘러가는 모든 곳에서는, 온갖 생물이 번성하며 살게 될 것이다. 이 물이 사해로 흘러 들어가면, 그 물도 깨끗하게 고쳐질 것이므로, 그 곳에도 아주 많은 물고기가 살게 될 것이다. 강물이 흘러가는 곳이면 어디에서나, 모든 것이 살 것이다. (9절)
    그 강가에는 이쪽이나 저쪽 언덕에 똑같이 온갖 종류의 먹을 과일 나무가 자라고, 그 모든 잎도 시들지 않고, 그 열매도 끊이지 않을 것이다. 나무들은 달마다 새로운 열매를 맺을 것인데, 그것은 그 강물이 성소에서부터 흘러 나오기 때문이다. 그 과일은 사람들이 먹고, 그 잎은 약재로 쓸 것이다. (12절)
