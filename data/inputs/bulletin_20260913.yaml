pastoral_corner:
  title: "글리온 회의(Glion Consultation)"
  text: |
    1986년 스위스 글리온에서 세계교회협의회(WCC)의 중재로 성사된 분단 이후 남북한 개신교 대표들의 최초 공식 만남이자 평화 통일 논의의 출발점이다. 냉전 구도가 견고하던 시기, 분단 40여 년 만에 남과 북의 신앙인들이 처음으로 마주 앉아 예배를 드리고 성찬을 나누며 한반도 평화 프로세스의 물꼬를 텄다.

    1. 배경 및 성사 과정
    WCC는 1984년 일본 도잔소(Tozanso)에서 국제협의회를 개최하고, “한반도 평화와 통일은 한국 교회만의 문제가 아닌 전 세계 교회의 과제”로 선언하면서 남북 교회의 공식 대화를 주선하기로 결의하였다. 남측(한국기독교교회협의회NCCK 총무 외), 북측(조선그리스도교연맹 서기장 외), WCC(총무, 국제청년국제문제위원회 국장 외)가 참여하여 1986년 1차 회의를 성사시켰고, 이어 1988년(2차), 1990년(3차) 글리온 회의가 이어지며 남북 교회의 교류가 정례화되었다.

    2. 핵심 성과와 역사적 의의
    1) 남북 민간 교류의 물꼬: 남북 교류협력법(1990년)이 제정되기도 전, 냉전 시대에 민간 차원에서 남북 간 대화 채널을 구축한 최초의 사례.
    2) “88선언”의 결정적 계기: 글리온 회의의 대화 경험은 1988년 NCCK가 발표한 「민족의 통일과 평화에 대한 한국기독교회 선언」(일명 88선언)의 핵심 토대가 됨.
    3) 남북 공동기도문 작성: 1989년부터 매년 광복절(남북 평화통일 남북공동기도주일)에 남북 교회가 동일한 기도문으로 예배를 드리는 전통이 형성됨.

    3. “88선언(민족의 통일과 평화에 대한 한국기독교회 선언)”의 의의
    1) 1988년 2월 29일 한국기독교교회협의회(NCCK) 제37차 총회에서 채택·발표된 선언문으로, 국가가 독점하던 통일 논의를 민간과 시민사회의 영역으로 확장시킨 한국 현대사의 결정적 분기점이 되었다.
    2) 정부가 독점하던 통일 담론의 금기를 깨고 민간 통일운동의 봇물을 터뜨렸다. 이후 1989년 문익환 목사 방북, 임수경 방북 사건 등 민간 차원의 교류 시도로 이어지는 사상적 배경이 되었다.
    3) 노태우 정부의 「7·7 특별선언」(1988)과 남북 합의의 기초가 된 「민족공동체통일방안」(1989), 나아가 「남북기본합의서」(1991)의 핵심 골격(체제 인정, 교류 협력, 단계적 평화 정착)에 직접적인 영향을 미쳤다.

    4. “88선언”의 핵심내용과 5대 기본원칙
    1) 핵심내용: 88선언은 ‘민족의 자주’, ‘평화’, ‘민족 대단결’이라는 7·4 남북공동성명의 정신을 계승하면서, 이를 구체화한 5대 기본원칙을 제시했다.
    2) 5대 기본원칙 : 자주적 통일, 평화적 통일, 민주적 통일, 인도주의적 실현, 민족대단결
