pastoral_yard:
  title: "광화문 시대,\n향린의 새 식구가 된 교우들을 축복합니다"
  intro: |
    2023년 6월, 향린교회가 광화문에 새 터전을 마련한 이후 오늘에 이르기까지, 새교우들이 우리 공동체의 든든한 지체로 발걸음을 함께해 주셨습니다.
    오늘 오후 1시 30분 향우실(1층)에서 열리는 새교우 만남의 자리 “향린, 알고 싶어요”를 맞이하여, 지난 3년여 동안 광화문 시대를 함께 열어온 새교우들의 명단을 나눕니다. 이분들이 향린의 자랑인 주체적 신앙과 민주적 공동체 속에서 깊이 뿌리내릴 수 있도록, 따뜻한 기도로 마음 모아 주시기를 부탁드립니다.
  sections:
    - year: "2023년 등록"
      members: "김도원 김민아 김정은 문현아 박광자 신성욱 안서영 오신근 유진 윤효중\n정미숙 조희상"
    - year: "2024년 등록"
      members: "강남규 김선정 김순종 김슬이 김영균 김영주 김준영 김지연 김현주B 나조은\n림원섭 박원구 박희규 이민우 이상훈 이순희 이승미 이재필 이지영 이태원\n이혜진B 이홍 전창윤 정승우 정해관 최동진 한선규"
    - year: "2025년 등록"
      members: "강성윤 강정희 기선영 김나리 김민철 김수연 김수해 김승주 김유경 김이경\n김준 김지윤 김진수 김한태 김혜경 류성헌 박명준 박정규 손주연 신예흰\n오명주 왕미선 원종일 유효선 윤인영 윤인희 이경희B 이나래 이문희 이보은\n이은주B 이정철 이지유 이하나 이혁 정원혁 정주영 정태윤 정현정 조경이\n조선희 조영우 조지은 지승미 채자경 최미정 최윤영 최재혁 한미수 한예은\n한유정 한정훈 한혜경 황선건"
    - year: "2026년 등록"
      members: "강윤주 김경희 김대훈 김수정 김은주 김지현 김태은 명현호 박지현 백승남\n서인애 서재정 신경자 안은경 왕희송 유정애 이래현 이명문 이익성 이혜순\n장현아 전하리 정대일 정소희 정일민 조상래 조상희 최양다음 최주만 최혜자"

